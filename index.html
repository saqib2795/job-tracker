<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:       #0f1117;
    --paper:     #f7f5f0;
    --cream:     #edeae3;
    --rule:      #d6d1c8;
    --accent:    #1a3a5c;
    --accent2:   #c8a84b;
    --green-bg:  #e8f5ee;
    --green-fg:  #1a6b3c;
    --red-bg:    #fdecea;
    --red-fg:    #b93030;
    --amber-bg:  #fef8e7;
    --amber-fg:  #8a6200;
    --blue-bg:   #e8f0fa;
    --blue-fg:   #1a3a8c;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--accent);
    color: #fff;
    padding: 48px 40px 36px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent,
      transparent 39px,
      rgba(255,255,255,.04) 39px,
      rgba(255,255,255,.04) 40px
    );
    pointer-events: none;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent2), transparent);
  }
  .header-inner { position: relative; max-width: 1200px; margin: 0 auto; }
  .header-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: rgba(255,255,255,.5);
    margin-bottom: 10px;
  }
  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(28px, 4vw, 46px);
    font-weight: 400;
    line-height: 1.1;
    letter-spacing: -.02em;
    margin-bottom: 6px;
  }
  header h1 em { font-style: italic; color: var(--accent2); }
  .header-sub {
    font-size: 14px;
    color: rgba(255,255,255,.55);
    font-weight: 300;
    margin-top: 6px;
  }
  .header-stats {
    display: flex;
    gap: 32px;
    margin-top: 28px;
    flex-wrap: wrap;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    line-height: 1;
    color: #fff;
  }
  .stat-num.gold { color: var(--accent2); }
  .stat-num.green { color: #6ee7a4; }
  .stat-num.red   { color: #f9a0a0; }
  .stat-label {
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: rgba(255,255,255,.45);
    font-family: 'DM Mono', monospace;
  }

  /* ── Controls ── */
  .controls {
    max-width: 1200px;
    margin: 28px auto 0;
    padding: 0 40px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #999;
    pointer-events: none;
  }
  input[type="search"] {
    width: 100%;
    padding: 9px 14px 9px 36px;
    border: 1.5px solid var(--rule);
    border-radius: 8px;
    background: #fff;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s;
  }
  input[type="search"]:focus { border-color: var(--accent); }

  .filter-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn {
    padding: 7px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--rule);
    background: #fff;
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all .15s;
    color: #666;
    white-space: nowrap;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .filter-btn.active.green  { background: var(--green-fg); border-color: var(--green-fg); }
  .filter-btn.active.red    { background: var(--red-fg);   border-color: var(--red-fg);   }
  .filter-btn.active.amber  { background: #b07800;         border-color: #b07800;         }

  .results-count {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: #999;
    white-space: nowrap;
    align-self: center;
    margin-left: auto;
  }

  /* ── Table ── */
  .table-wrap {
    max-width: 1200px;
    margin: 20px auto 60px;
    padding: 0 40px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  thead th {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #888;
    text-align: left;
    padding: 10px 12px;
    border-bottom: 2px solid var(--rule);
    background: var(--paper);
    position: sticky;
    top: 0;
    z-index: 1;
    white-space: nowrap;
  }
  thead th:first-child  { width: 44px; text-align: center; }
  thead th:nth-child(2) { width: 200px; }
  thead th:nth-child(4) { width: 120px; }
  thead th:nth-child(5) { width: 160px; }

  tbody tr {
    border-bottom: 1px solid var(--rule);
    transition: background .1s;
  }
  tbody tr:hover { background: var(--cream); }
  tbody tr.hidden { display: none; }

  td { padding: 11px 12px; vertical-align: middle; line-height: 1.4; }
  td:first-child {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: #bbb;
    text-align: center;
  }
  .company-name { font-weight: 600; color: var(--ink); }
  .position-name { color: #555; font-size: 13px; margin-top: 2px; }
  .date-cell {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: #888;
    white-space: nowrap;
  }

  /* Status badges */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge-applied      { background: var(--green-bg); color: var(--green-fg); }
  .badge-review       { background: var(--amber-bg); color: var(--amber-fg); }
  .badge-rejected     { background: var(--red-bg);   color: var(--red-fg);   }
  .badge-started      { background: var(--blue-bg);  color: var(--blue-fg);  }
  .badge-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  /* ── Empty state ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #aaa;
  }
  .empty-state svg { margin-bottom: 12px; opacity: .4; }
  .empty-state p { font-size: 15px; }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 20px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: #bbb;
    border-top: 1px solid var(--rule);
  }

  @media (max-width: 700px) {
    header, .controls, .table-wrap { padding-left: 16px; padding-right: 16px; }
    .header-stats { gap: 20px; }
    .stat-num { font-size: 24px; }
    table { font-size: 11.5px; }
    td, thead th { padding: 8px 5px; }
    .company-name { font-size: 12px; }
    .position-name { font-size: 11px; }
    .date-cell { font-size: 11px; white-space: nowrap; }
    .badge { padding: 3px 7px; font-size: 10.5px; }
  }
</style>
</head>

function badgeClass(s) {
  if (s.includes('under review')) return 'badge-review';
  if (s.includes('started'))      return 'badge-started';
  if (s.includes('Rejected'))     return 'badge-rejected';
  return 'badge-applied';
}

function render(rows) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td>${r.num}</td>
      <td class="company-name">${r.company}</td>
      <td class="position-name">${r.position}</td>
      <td class="date-cell">${r.date}</td>
      <td><span class="badge ${badgeClass(r.status)}"><span class="badge-dot"></span>${r.status.replace(/^[✅❌]\s*/,'')}</span></td>
    </tr>
  `).join('');

  // Update stats
  const total    = DATA.length;
  const rejected = DATA.filter(r => r.status.includes('Rejected')).length;
  const active   = total - rejected;
  const rate     = Math.round(rejected / total * 100) + '%';
  document.getElementById('stat-total').textContent    = total;
  document.getElementById('stat-active').textContent   = active;
  document.getElementById('stat-rejected').textContent = rejected;
  document.getElementById('stat-rate').textContent     = rate;
  document.getElementById('results-count').textContent = rows.length === DATA.length ? `${total} applications` : `${rows.length} of ${total}`;
  document.getElementById('empty').style.display = rows.length === 0 ? 'block' : 'none';
}

function applyFilters() {
  let rows = DATA;
  if (currentFilter === 'applied')  rows = rows.filter(r => r.status.includes('Applied') && !r.status.includes('review') && !r.status.includes('started'));
  if (currentFilter === 'review')   rows = rows.filter(r => r.status.includes('review') || r.status.includes('started'));
  if (currentFilter === 'rejected') rows = rows.filter(r => r.status.includes('Rejected'));
  if (currentSearch) {
    const q = currentSearch.toLowerCase();
    rows = rows.filter(r => r.company.toLowerCase().includes(q) || r.position.toLowerCase().includes(q));
  }
  render(rows);
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilters();
  });
});

document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value.trim();
  applyFilters();
});

applyFilters();
</script>
</body>
</html>
